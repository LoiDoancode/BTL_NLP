name: CI — Clean Code & Pre-Merge Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Clean Code (Ruff Lint & Format)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run Ruff linter
        run: ruff check .

      - name: Check code formatting
        run: ruff format --check .

  pre-merge-checks:
    name: Project Rules & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install lightweight test dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pyyaml numpy pandas scikit-learn networkx

      - name: Check Python syntax (compileall)
        run: python -m compileall -q data tokenizer models scripts eval kg_fusion tests train_scratch.py decode.py

      - name: Enforce From-Scratch rule (no nn.Transformer in models/scratch)
        run: |
          python -c "
          import pathlib, sys
          violations = []
          for p in pathlib.Path('models/scratch').rglob('*.py'):
              text = p.read_text(encoding='utf-8')
              if 'nn.Transformer' in text or 'torch.nn.Transformer' in text:
                  violations.append(str(p))
          if violations:
              print('ERROR: torch.nn.Transformer is forbidden in models/scratch/:', violations)
              sys.exit(1)
          print('OK: No nn.Transformer usage found in models/scratch/.')
          "

      - name: Validate configs/config.yaml & reproducibility seed
        run: |
          python -c "
          import yaml, sys
          with open('configs/config.yaml', encoding='utf-8') as f:
              cfg = yaml.safe_load(f)
          assert isinstance(cfg, dict) and 'seed' in cfg, 'Missing seed in configs/config.yaml'
          print(f'OK: config.yaml valid (seed={cfg[\"seed\"]})')
          "

      - name: Block large files (> 50MB) from being committed
        run: |
          python -c "
          import pathlib, sys
          large = [str(p) for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.stat().st_size > 50 * 1024 * 1024]
          if large:
              print('ERROR: Large files (>50MB) detected. Do not commit checkpoints/datasets:', large)
              sys.exit(1)
          print('OK: No large files (>50MB) found.')
          "

      - name: Run unit tests (pytest)
        run: pytest -v tests/
