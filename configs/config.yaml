# Cấu hình chung cho BTL NLP (Seed cố định để tái lập kết quả)
seed: 42

data:
  dataset_name: "GEM/web_nlg"
  language: "en"
  processed_dir: "data/processed"
  triple_separator: " | "

tokenizer:
  vocab_size: 16000
  save_dir: "tokenizer/artifacts"

scratch:
  # Cấu hình baseline theo Tasks_NLP.docx
  num_encoder_layers: 6
  num_decoder_layers: 6
  d_model: 512
  n_heads: 8
  d_ff: 2048
  dropout: 0.1
  max_length: 256
  use_pre_ln: true
  weight_tying: true
  label_smoothing: 0.1
  batch_size: 32
  learning_rate: 5.0e-4
  warmup_steps: 4000
  epochs: 30
  beam_size: 4
  checkpoint_dir: "outputs/checkpoints/scratch"

llm_under6b:
  # Chốt 02 mô hình < 6B tham số sau khi khảo sát ở Tuần 1
  models: []
  max_seq_length: 512
  load_in_4bit: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  learning_rate: 2.0e-4
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  output_dir: "outputs/checkpoints/llm_under6b"

eval:
  predictions_dir: "outputs/predictions"
  kg_output_dir: "outputs/kg"
